version = "5.0"
name = "xberg"
description = "Local document extraction: text, tables, metadata, images from 107 formats with optional OCR."
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
gitignore = true

[plugin]
runtimes = ["claude", "cursor", "codex", "gemini", "kimi", "opencode", "factory", "hermes", "pi"]
name = "xberg"
version = "1.3.8"
display_name = "Xberg"
description = "Local document extraction: text, tables, metadata, images from 107 formats with optional OCR."
homepage = "https://xberg.io"
repository = "https://github.com/xberg-io/xberg"
license = "MIT"
category = "document-intelligence"
brand_color = "#1F6FEB"
icon = "./assets/icon.svg"
logo = "./assets/logo.png"
keywords = ["document-intelligence", "extraction", "ocr", "pdf", "tables"]

[plugin.author]
name = "Kreuzberg, Inc."
email = "contact@xberg.io"
url = "https://xberg.io"

[[plugin.mcp]]
name = "xberg"
command = "${PLUGIN_ROOT}/scripts/mcp-launch.sh"
args = ["mcp", "--transport", "stdio"]

[plugin.interface]
display_name = "Xberg"
short_description = "Local document extraction for 107 formats"
long_description = "Extract text, tables, metadata, and images from PDFs, Office files, images, HTML, email, archives, and academic formats. Runs locally via the xberg CLI and an auto-registered MCP server. Plugin ships skills covering the CLI surface, OCR backends, table extraction, and output-format selection."
developer_name = "Kreuzberg, Inc."
category = "document-intelligence"
capabilities = ["Read"]
default_prompt = ["Extract text from this PDF", "OCR a scanned image", "List supported formats"]
website_url = "https://xberg.io"
privacy_policy_url = "https://xberg.io/privacy"
terms_of_service_url = "https://xberg.io/terms"
composer_icon = "./assets/icon.svg"
logo = "./assets/logo.png"
brand_color = "#1F6FEB"

[plugin.gemini]
context_file_name = "GEMINI.md"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"
