  prefetch-mineru-models:
    name: Prefetch MinerU model weights
    # Intentionally NOT `needs: setup`: prefetching MinerU weights only needs the
    # repo (scripts + fixtures), not the built harness, so it runs concurrently
    # with the FFI/harness build from the first stage instead of waiting for it.
    # Checks out the same ref setup resolves (its later source-sha pin is only
    # needed by jobs that must match the benchmarked binary's exact revision).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}
          submodules: recursive

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      # Bench cohorts span pdf/office/markup/ebook/email/data/images across the
      # xberg + 6 competitor jobs -- no glob subset is safe here. ~keep
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1

      - name: Setup Python
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-mineru
          install-command: "uv sync --frozen --no-install-project --no-install-workspace --group dev --group bench-mineru"

      - name: Install system dependencies (libgl1 + libglib2.0-0 for mineru)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-eng

      - name: Configure Hugging Face cache
        run: |
          mkdir -p "$HOME/.cache/huggingface/hub"
          {
            echo "HF_HOME=$HOME/.cache/huggingface"
            echo "HF_HUB_CACHE=$HOME/.cache/huggingface/hub"
            echo "MINERU_MODEL_SOURCE=huggingface"
          } >> "$GITHUB_ENV"

      - name: Restore MinerU model cache
        id: mineru-model-cache
        uses: actions/cache@v6
        with:
          path: ~/.mineru/models
          # MinerU 4 basic uses a new ONNX model repository and local model registry. ~keep
          key: mineru4-basic-onnx-gen1-${{ runner.os }}-${{ runner.arch }}

      - name: Warm MinerU basic CPU model weights
        if: steps.mineru-model-cache.outputs.cache-hit != 'true'
        env:
          UV_NO_SYNC: "1"
          MINERU_MODEL_SMALL_BACKEND: onnx
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PYTHON'
          from mineru.model.download import download_model_repo
          from mineru.model.registry import model_repos_for_tier
          repos = model_repos_for_tier("basic", small_backend="onnx")
          assert len(repos) == 1, f"Unexpected basic model repository count: {len(repos)}"
          for repo in repos:
              download_model_repo(repo, source="huggingface")
          PYTHON
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --no-ocr --format=markdown sync test_documents/pdf/fake_memo.pdf > /dev/null
          uv run --no-sync python tools/benchmark-harness/scripts/mineru_extract.py \
            --ocr --format=markdown sync test_documents/pdf/non_searchable.pdf > /dev/null

      - name: Verify MinerU basic model completeness
        env:
          UV_NO_SYNC: "1"
          MINERU_MODEL_SMALL_BACKEND: onnx
          MINERU_MODEL_SOURCE: local
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PYTHON'
          from mineru.model.download import verify_model_repo
          from mineru.model.registry import model_repos_for_tier
          repos = model_repos_for_tier("basic", small_backend="onnx")
          assert len(repos) == 1, f"Unexpected basic model repository count: {len(repos)}"
          for repo in repos:
              result = verify_model_repo(repo)
              assert result.ready, f"Incomplete model repository: {result.missing_paths}"
              print(f"Verified {repo.name}: {result.root}")
          PYTHON

      - name: Package MinerU model cache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mineru-model-cache"
          tar -C "$HOME" -cf "$RUNNER_TEMP/mineru-model-cache/mineru-models.tar" .mineru/models
          ls -lh "$RUNNER_TEMP/mineru-model-cache/mineru-models.tar"

      - name: Upload MinerU model cache
        uses: actions/upload-artifact@v7
        with:
          name: mineru-model-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/mineru-model-cache/mineru-models.tar
          retention-days: 1
          if-no-files-found: error

