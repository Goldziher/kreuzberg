name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Optional branch or commit (defaults to the dispatched revision)"
        required: false
        default: ""
        type: string
      timeout:
        description: "Timeout per document in seconds"
        required: false
        default: "900"
        type: string

env:
  ITERATIONS: "3"
  TIKA_VERSION: "3.3.1"
  TIKA_SHA256: "0e8ee9795ac4244feab466f4a5a9c3b94675af392848243842cb6e1e69d27103"
  ORT_VERSION: "1.24.2"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  RUST_MIN_STACK: 16777216
  RUSTFLAGS: "-C strip=symbols"
  MEASURE_QUALITY: "true"
  OCR_ENABLED: "true"
  RUN_OCR_BENCHMARKS: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GROUND_TRUTH_DIR: "test_documents/ground_truth"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Build harness + native libs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: benchmarks-target
      source-sha: ${{ steps.source-revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

          submodules: recursive
      - name: Pin benchmark source revision
        id: source-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Ensure benchmark harness exists
        run: scripts/benchmarks/ensure-benchmark-harness-exists.sh

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-setup
          use-sccache: "false"
          disable-cache: "false"
          report-stats: "true"

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Layout Models
        uses: ./.github/actions/setup-layout-models

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Install uv for benchmark dependency contracts
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"

      - name: Validate benchmark scripts
        run: task benchmark:validate:scripts

      - name: Cache benchmark harness
        uses: ./.github/actions/cache-benchmark-harness
        with:
          build-profile: release

      - name: Provision swap for all-feature release link
        run: task benchmark:setup:swap

      - name: Build xberg-cli (release, all features + Sceptre tract diagnostic)
        run: cargo build --locked --release -p xberg-cli --features all,xberg/sceptre-ocr-tract

      # Bench cohorts span pdf/office/markup/ebook/email/data/images across the
      # xberg + 6 competitor jobs -- no glob subset is safe here. ~keep
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BENCHMARK_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install zstd (corpus cache decompression)
        run: sudo apt-get install -y zstd

      - name: Restore reference corpus cache
        env:
          GCP_BENCHMARK_BUCKET: ${{ secrets.GCP_BENCHMARK_BUCKET }}
        run: scripts/benchmarks/restore-corpus-cache.sh

      - name: Validate ground truth
        run: >-
          cargo run --locked --release -p benchmark-harness -- validate-gt
          --fixtures tools/benchmark-harness/fixtures --strict

      - name: Validate workflow matrix against harness contracts
        run: scripts/ci/benchmarks/validate-workflow-matrix.py

      - name: Package reference corpus cache
        run: tar -C test_documents -cf corpus-cache.tar .corpus-cache/pdf .corpus-cache/ground_truth

      - name: Upload reference corpus cache
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-corpus-cache
          path: corpus-cache.tar
          retention-days: 7

      - name: Log disk space before artifact upload
        run: scripts/ci/validate/show-disk-space.sh "Disk space before artifact upload"

      - name: Upload build artifacts (harness binary + xberg-cli)
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-target
          path: |
            target/release/benchmark-harness
            target/release/xberg
          retention-days: 7
          if-no-files-found: warn

      - name: Upload benchmark harness binary (for third-party jobs)
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-harness-binary
          path: |
            target/release/benchmark-harness
          retention-days: 7

      - name: Log disk space after artifact upload
        run: scripts/ci/validate/show-disk-space.sh "Disk space after artifact upload"

  validate-harness:
    name: Validate benchmark harness
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}
          submodules: recursive

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-validate-harness
          install-llvm-cov: "false"

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BENCHMARK_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Install zstd (corpus cache decompression)
        run: sudo apt-get install -y zstd

      - name: Restore reference corpus cache
        env:
          GCP_BENCHMARK_BUCKET: ${{ secrets.GCP_BENCHMARK_BUCKET }}
        run: scripts/benchmarks/restore-corpus-cache.sh

      # ~keep These deterministic tests validate configuration and artifact contracts; they do
      # ~keep not measure the release binaries built by setup and must not trigger another fat-LTO link.
      - name: Validate benchmark cohorts
        run: |
          set -euo pipefail
          cargo test --locked -p benchmark-harness --lib 'cohort::tests::' 2>&1 | tee /tmp/cohort-tests.log
          if ! grep -qE '^test result: ok\. [1-9][0-9]* passed' /tmp/cohort-tests.log; then
            echo "::error::'cohort::tests::' matched 0 tests -- benchmark cohort validation silently stopped executing" >&2
            exit 1
          fi

      - name: Validate benchmark harness contracts
        # ~keep --no-fail-fast runs every named test binary, so one broken contract does not hide
        # ~keep failures in the other targets (observed in run 31632507453).
        run: >-
          cargo test --locked -p benchmark-harness --no-fail-fast
          --test validate_artifacts --test lossless_aggregation
          --test fixture_validation --test aggregate_schema

  prefetch-tika:
    name: Prefetch Apache Tika
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download Apache Tika once
        run: |
          mkdir -p tools/benchmark-harness/libs
          jar_path="tools/benchmark-harness/libs/tika-app-${TIKA_VERSION}.jar"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 \
            -o "${jar_path}" \
            "https://repo.maven.apache.org/maven2/org/apache/tika/tika-app/${TIKA_VERSION}/tika-app-${TIKA_VERSION}.jar"
          echo "${TIKA_SHA256}  ${jar_path}" | sha256sum --check

      - name: Upload Apache Tika artifact
        uses: actions/upload-artifact@v7
        with:
          name: apache-tika-jar
          path: tools/benchmark-harness/libs/tika-app-${{ env.TIKA_VERSION }}.jar
          retention-days: 7

  bench-rust:
    name: bench-rust (${{ matrix.pipeline }}, ${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: setup
    # Previously split heavy pipelines (layout/paddle/sceptre) onto runner-large-arm64 and
    # the rest onto runner-medium-arm64. Both self-hosted arm64 pools were retired, so every
    # leg now runs on the same hosted arm64 machine — figures need re-baselining before they
    # are compared against numbers published from the old runners.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pipeline:
          - baseline
          - layout
          - baseline-paddle
          - layout-paddle
          - sceptre-ort
          - sceptre-ort-layout
          - sceptre-ort-autorotate
        output_format: [markdown, plaintext]
        mode: [single-file, batch]
        cohort:
          - native-pdf-fast-b8
          - ocr-pdf-fast-b4
          - native-office-fast
          - native-markup-fast
          - native-ebook-fast
          - native-email-fast
          - native-data-fast
          - ocr-images-fast
        # The layout pipeline only benefits rendered-page formats (PDF, images); for the other
        # families a layout run would merely duplicate baseline, so drop those cells.
        # The PaddleOCR-engine variants (baseline-paddle, layout-paddle) force OCR, so they run ONLY
        # on the OCR cohorts (ocr-pdf-fast-b4, ocr-images-fast); drop them from every non-OCR cohort.
        # Sceptre ORT remains a release comparison for OCR PDFs. Its image coverage runs against the
        # bounded structured-image diagnostic cohort below, outside the published release contract.
        # NOTE: keep this block a clean list of `- {...}` entries — the validate-workflow-matrix.py
        # exclude parser stops at the first non-entry line, so do not intersperse comments here.
        exclude:
          - { pipeline: layout, cohort: native-office-fast }
          - { pipeline: layout, cohort: native-markup-fast }
          - { pipeline: layout, cohort: native-ebook-fast }
          - { pipeline: layout, cohort: native-email-fast }
          - { pipeline: layout, cohort: native-data-fast }
          - { pipeline: baseline-paddle, cohort: native-pdf-fast-b8 }
          - { pipeline: baseline-paddle, cohort: native-office-fast }
          - { pipeline: baseline-paddle, cohort: native-markup-fast }
          - { pipeline: baseline-paddle, cohort: native-ebook-fast }
          - { pipeline: baseline-paddle, cohort: native-email-fast }
          - { pipeline: baseline-paddle, cohort: native-data-fast }
          - { pipeline: layout-paddle, cohort: native-pdf-fast-b8 }
          - { pipeline: layout-paddle, cohort: native-office-fast }
          - { pipeline: layout-paddle, cohort: native-markup-fast }
          - { pipeline: layout-paddle, cohort: native-ebook-fast }
          - { pipeline: layout-paddle, cohort: native-email-fast }
          - { pipeline: layout-paddle, cohort: native-data-fast }
          - { pipeline: sceptre-ort, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort, cohort: native-office-fast }
          - { pipeline: sceptre-ort, cohort: native-markup-fast }
          - { pipeline: sceptre-ort, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort, cohort: native-email-fast }
          - { pipeline: sceptre-ort, cohort: native-data-fast }
          - { pipeline: sceptre-ort, cohort: ocr-images-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort-layout, cohort: native-office-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-markup-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-email-fast }
          - { pipeline: sceptre-ort-layout, cohort: native-data-fast }
          - { pipeline: sceptre-ort-layout, cohort: ocr-images-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-pdf-fast-b8 }
          - { pipeline: sceptre-ort-autorotate, cohort: native-office-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-markup-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-ebook-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-email-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: native-data-fast }
          - { pipeline: sceptre-ort-autorotate, cohort: ocr-images-fast }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust toolchain
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-rust-${{ matrix.pipeline }}
          use-sccache: "true"
          report-stats: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      # Bench cohorts span pdf/office/markup/ebook/email/data/images across the
      # xberg + 6 competitor jobs -- no glob subset is safe here. ~keep
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Layout Models
        if: contains(matrix.pipeline, 'layout')
        uses: ./.github/actions/setup-layout-models

      # The bench-rust runner ships only `python3` (no `python` alias, and its system
      # python3 is externally-managed without pip), so the PaddleOCR model action's
      # `python -m pip install huggingface_hub` fails with exit 127. Provision a managed
      # Python with pip (matching the competitor jobs) before the model download.
      - name: Setup Python (PaddleOCR model download)
        if: contains(matrix.pipeline, 'paddle')
        uses: xberg-io/actions/setup-python-env@v1
        with:
          python-version: "3.11"
          cache-prefix: benchmark-paddle-hf
          install-command: "python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'"

      - name: Setup PaddleOCR Models
        if: contains(matrix.pipeline, 'paddle')
        uses: ./.github/actions/setup-paddle-ocr-models

      - name: Pre-warm Sceptre ORT models
        if: contains(matrix.pipeline, 'sceptre-ort')
        env:
          PIPELINE: ${{ matrix.pipeline }}
        run: |
          set -euo pipefail
          for language in eng deu jpn; do
            args=(
              extract test_documents/images/test_hello_world.png
              --ocr true
              --force-ocr true
              --ocr-backend sceptre
              --ocr-backend-options '{"model":{"backend":"ort"}}'
              --ocr-language "$language"
              --no-cache true
              --format json
            )
            if [[ "$PIPELINE" == "sceptre-ort-autorotate" ]]; then
              args+=(--ocr-auto-rotate true)
            fi
            ./target/release/xberg "${args[@]}" >/dev/null
          done

      - name: Run benchmark
        env:
          FRAMEWORK: xberg-${{ matrix.output_format }}-${{ matrix.pipeline }}
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/${{ matrix.cohort }}.json
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-rust-${{ matrix.pipeline }}-${{ matrix.output_format }}-${{ matrix.mode }}-${{ matrix.cohort }}-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  # Exercises `PdfBackend::Pdfium` (crates/xberg/src/extractors/pdf/pdfium_engine.rs) as its own
  # recorded framework, separate from `bench-rust`'s native-backend legs. `setup` already builds
  # `xberg-cli` with `--features all,...`, and `all` includes `pdf-pdfium-surface` ->
  # `xberg/pdf-pdfium` (crates/xberg-cli/Cargo.toml), so the CLI binary this job downloads already
  # has the pdfium engine compiled in -- what it lacks is a real `libpdfium` runtime library,
  # provisioned below via the same `download-pdfium` composite action `ci-rust.yaml`'s
  # `pdfium-engine` job uses, pinned to the same 7678 release the checked-in
  # `crates/xberg-pdfium-render` bindings were generated against (see that job for the version
  # mismatch rationale). Restricted to the `baseline` pipeline and the PDF-only cohort: the
  # pdfium engine has no OCR fallback and is deliberately smaller in scope than the native engine
  # (no tables/images/annotations/form fields), so this is not a fair substitute for the
  # native-backend legs above -- it is a distinct measurement, hence the `-pdfium` framework
  # suffix and its own uploaded artifact.
  #
  # Pdfium is part of the native cohort's pinned release contract, so the `bench-` prefix keeps
  # these required cells visible to the workflow/contract validator and aggregation gate. ~keep
  bench-pdfium:
    name: pdfium-benchmark (baseline, ${{ matrix.output_format }}, ${{ matrix.mode }})
    needs: setup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        output_format: [markdown, plaintext]
        mode: [single-file, batch]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.source-sha }}

          submodules: recursive
      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Setup Rust toolchain
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmarks-rust-pdfium
          use-sccache: "true"
          report-stats: "true"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      # Only the pdf/ fixtures the native-pdf-fast-b8 cohort references are needed here.
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1
        with:
          include: |
            pdf/**

      - name: Download reference corpus cache
        uses: actions/download-artifact@v8
        with:
          name: benchmark-corpus-cache
          path: ${{ runner.temp }}/benchmark-corpus-cache

      - name: Unpack reference corpus cache
        run: tar -C test_documents -xf "${RUNNER_TEMP}/benchmark-corpus-cache/corpus-cache.tar"

      # bench-rust runs this step unconditionally regardless of pipeline (not gated on
      # `contains(matrix.pipeline, ...)`), so the `xberg-cli` binary built with `--features all`
      # apparently expects an ONNX Runtime library reachable even for a baseline-only run.
      # Mirrored here rather than assumed-unnecessary. ~keep
      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Download Pdfium runtime (pinned to the checked-in bindings' release)
        uses: ./.github/actions/download-pdfium
        with:
          pdfium-version: "7678"

      - name: Run benchmark
        env:
          FRAMEWORK: xberg-${{ matrix.output_format }}-baseline-pdfium
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: ${{ matrix.output_format }}
          PDF_BACKENDS: pdfium
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/native-pdf-fast-b8.json
          PDFIUM_DYNAMIC_LIB_PATH: ${{ env.XBERG_PDFIUM_PREBUILT }}/lib
          LD_LIBRARY_PATH: ${{ env.XBERG_PDFIUM_PREBUILT }}/lib:${{ env.LD_LIBRARY_PATH }}
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-rust-pdfium-baseline-${{ matrix.output_format }}-${{ matrix.mode }}-native-pdf-fast-b8-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  sceptre-structured-diagnostic:
    name: sceptre structured-image diagnostic (${{ matrix.pipeline }}, ${{ matrix.mode }})
    needs: setup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pipeline: [sceptre-ort, sceptre-ort-layout, sceptre-ort-autorotate, sceptre-tract]
        mode: [single-file, batch]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.source-sha }}
          submodules: recursive

      - name: Free disk space
        uses: xberg-io/actions/free-disk-space-linux@v1

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.setup.outputs.artifact-name }}
          path: target/release

      - name: Restore benchmark binary permissions
        run: scripts/benchmarks/restore-binary-permissions.sh

      # Bench cohorts span pdf/office/markup/ebook/email/data/images across the
      # xberg + 6 competitor jobs -- no glob subset is safe here. ~keep
      - name: Fetch test_documents fixtures
        uses: xberg-io/actions/fetch-test-documents@v1

      - name: Setup ONNX Runtime
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: ${{ env.ORT_VERSION }}

      - name: Setup Layout Models
        if: contains(matrix.pipeline, 'layout')
        uses: ./.github/actions/setup-layout-models

      - name: Pre-warm Sceptre diagnostic models
        env:
          PIPELINE: ${{ matrix.pipeline }}
        run: |
          set -euo pipefail
          backend="ort"
          if [[ "$PIPELINE" == "sceptre-tract" ]]; then
            backend="tract"
          fi
          args=(
            extract test_documents/images/test_hello_world.png
            --ocr true
            --force-ocr true
            --ocr-backend sceptre
            --ocr-backend-options "{\"model\":{\"backend\":\"${backend}\"}}"
            --ocr-language eng
            --no-cache true
            --format json
          )
          if [[ "$PIPELINE" == "sceptre-ort-autorotate" ]]; then
            args+=(--ocr-auto-rotate true)
          fi
          ./target/release/xberg "${args[@]}" >/dev/null

      - name: Run bounded diagnostic benchmark
        env:
          FRAMEWORK: xberg-markdown-${{ matrix.pipeline }}
          MODE: ${{ matrix.mode }}
          OUTPUT_FORMAT: markdown
          ITERATIONS: ${{ env.ITERATIONS }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
          COHORT: tools/benchmark-harness/cohorts/ocr-images-structured.json
        run: scripts/benchmarks/run-benchmark.sh

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-${{ matrix.pipeline }}-markdown-${{ matrix.mode }}-ocr-images-structured-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30

  bench-docling:
    name: docling (${{ matrix.output_format }}, ${{ matrix.mode }}, ${{ matrix.cohort }})
    needs: [setup, bench-rust]
    if: ${{ needs.setup.result == 'success' && !cancelled() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [single-file, batch]
        output_format: [markdown, plaintext]
        # Docling supports the multi-format families it has native readers for (office,
        # markup, data) plus images; ebook/email are xberg-only. Cells for formats Docling
        # cannot read are best-effort in the release contract, so partial coverage is fine.
        cohort:
          - native-pdf-fast-b8
          - ocr-pdf-fast-b4
          - native-office-fast
          - native-markup-fast
          - native-data-fast
          - ocr-images-fast
    steps:
