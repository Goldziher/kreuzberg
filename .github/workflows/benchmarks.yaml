          from mineru.model.registry import model_repos_for_tier
          repos = model_repos_for_tier("basic", small_backend="onnx")
          assert len(repos) == 1, f"Unexpected basic model repository count: {len(repos)}"
          for repo in repos:
              result = verify_model_repo(repo)
              assert result.ready, f"Restored model repository is incomplete: {result.missing_paths}"
          PYTHON
          du -sh "$HOME/.mineru/models"

      - name: Log MinerU offline env and restored cache state
        if: always()
        run: |
          set -uo pipefail
          echo "=== MinerU offline env ==="
