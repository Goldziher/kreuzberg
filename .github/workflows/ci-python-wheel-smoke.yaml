name: CI Python Wheel Smoke

# The publish.yaml `python-wheels` job builds the glibc/macOS/Windows Python
# wheels and, since 94e498c5d0, installs and runs a real extraction against
# each one -- but that job only ever runs on `release: published` /
# `workflow_dispatch` / `repository_dispatch`, i.e. only when cutting an
# actual release. Its smoke test has never executed even once: publish.yaml
# has not run since it landed.
#
# ~keep Unlike the musl legs built by publish.yaml, this is not wired to automatic
# CI: the matrix is five OS runners driving a full cibuildwheel pass per leg.
# Run it on demand as part of release verification.
on:
  workflow_dispatch:

concurrency:
  group: ci-python-wheel-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GLIBC_FLOOR: "2.28"

jobs:
  python-wheel-smoke:
    name: Build + smoke-test Python wheel (${{ matrix.os }})
    if: github.repository == 'xberg-io/xberg' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps

      # pyke's default download strategy links a Windows ORT build that always
      # imports DirectML.dll (ort-sys's static_link_prerequisites is
      # unconditional on windows targets), which this repo never ships and
      # which no arm of ort_discovery.rs ever selects -- so `import xberg`
      # fails on a clean Windows host before any Rust code runs
      # (xberg-io/xberg#1456). This step forces ORT_STRATEGY=system (the same
      # strategy every other Windows leg in publish.yaml already uses), which
      # hits an early return in ort-sys before static_link_prerequisites runs,
      # so the DirectML import is never introduced in the first place.
      - name: Setup ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-onnx-runtime
        with:
          ort-version: "1.24.2"
          dest-dir: crates/xberg-py

      - name: Build wheels
        uses: xberg-io/actions/build-python-wheels@v1
        with:
          python-version: "3.13"
          package-dir: packages/python
          cibw-build: "cp310-*"
          upload-artifact: "false"
          build-libheif: "true"
          manylinux-x86_64-image: "manylinux_2_28"
          manylinux-aarch64-image: "manylinux_2_28"
          cibw-before-build-linux: |
            set -euo pipefail
            pip install maturin uv
            source ~/.cargo/env
            # Prevent GCC 14+ from emitting C23-versioned glibc symbols (__isoc23_strtoll etc.)
            # that require glibc ≥ 2.38. Fixes #588: ensures wheels work on Debian 12 (glibc 2.36),
            # Ubuntu 22.04 LTS (2.35), and RHEL 8 (2.28).
            export CFLAGS="-std=gnu11"
            export CXXFLAGS="-std=gnu++17"
            export CPPFLAGS="-std=gnu11"
            export CMAKE_C_FLAGS="${CFLAGS}"
            export CMAKE_CXX_FLAGS="${CXXFLAGS}"
            export CC="gcc ${CFLAGS}"
            export CXX="g++ ${CXXFLAGS}"
            # Link Microsoft's glibc-clean ONNX Runtime, not the pyke prebuilt; auditwheel bundles it (#1284).
            ort_version=1.24.2
            case "$(uname -m)" in aarch64 | arm64) ort_arch=aarch64 ;; *) ort_arch=x64 ;; esac
            curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ort_version}/onnxruntime-linux-${ort_arch}-${ort_version}.tgz"
            mkdir -p /opt/msort && tar -xzf /tmp/ort.tgz -C /opt/msort --strip-components=1
          cibw-environment: 'MATURIN_BUILD_ARGS="--compatibility manylinux_2_28" CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc CC_x86_64_unknown_linux_gnu=gcc CC_aarch64_unknown_linux_gnu=gcc CXX_x86_64_unknown_linux_gnu=g++ CXX_aarch64_unknown_linux_gnu=g++ ORT_STRATEGY=system ORT_LIB_LOCATION=/opt/msort/lib ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1 LD_LIBRARY_PATH=/opt/msort/lib'
          # The deployment target is the wheel's macOS floor: 15.0 left macOS 11-14
          # with no installable wheel (#1243). delocate bundles the libheif closure,
          # so the hook builds it from source at the target and PKG_CONFIG_PATH links
          # the wheel against it instead of Homebrew's runner-OS bottles. ~keep
          cibw-before-build-macos: bash {project}/scripts/ci/build-macos-heif-deps.sh
          cibw-environment-macos: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true MACOSX_DEPLOYMENT_TARGET=11.0 PKG_CONFIG_PATH=/tmp/xberg-heif/lib/pkgconfig'
          cibw-before-build-windows: "rustup install 1.99.1-x86_64-pc-windows-msvc --profile minimal --component rust-src --component rustfmt --component clippy && rustup target add x86_64-pc-windows-msvc --toolchain 1.99.1-x86_64-pc-windows-msvc && pip install maturin uv && set PATH=%USERPROFILE%\\.cargo\\bin;%PATH%"
          cibw-environment-windows: 'MATURIN_BUILD_ARGS="--target x86_64-pc-windows-msvc" RUSTUP_TOOLCHAIN="1.99.1-x86_64-pc-windows-msvc" RUSTC_WRAPPER='

      - name: Vendor ONNX Runtime into wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/vendor-native-closure.sh "$w"; done

      - name: Vendor ONNX Runtime into wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\vendor-windows-wheel-closure.ps1" -Wheel $_.FullName -DllSourceDir "$env:ORT_LIB_LOCATION" -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "vendor-windows-wheel-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel has no DirectML import and ships ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path wheelhouse -Filter "*.whl" | ForEach-Object {
            & "${{ github.workspace }}\scripts\ci\verify-windows-dll-closure.ps1" -Artifact $_.FullName -NativeGlob "*.pyd"
            if ($LASTEXITCODE -ne 0) { throw "verify-windows-dll-closure failed for $($_.FullName)" }
          }

      - name: Verify wheel glibc floor + bundled ONNX Runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for w in wheelhouse/*.whl; do bash scripts/ci/verify-glibc-floor.sh "$w" "$GLIBC_FLOOR"; done

      # The checks above only prove a file exists (or, for Linux/Windows,
      # inspect symbols/imports statically) -- none of them ever import or
      # run the wheel. This installs it into a real venv on this same runner
      # (matching glibc/macOS/Windows -- the family it was actually built
      # for) and runs a real extraction against a known fixture, asserting
      # the exact expected text comes back. No continue-on-error: a broken
      # wheel must fail this job, not merely warn.
      - name: Smoke-test wheel (real extraction, not just import)
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find wheelhouse -name '*.whl' | head -n1)"
          python="python3"
          venv_python="smoke-venv/bin/python"
          if [ "${{ runner.os }}" = "Windows" ]; then
            python="python"
            venv_python="smoke-venv/Scripts/python.exe"
          fi
          "$python" -m venv smoke-venv
          "$venv_python" -m pip install --no-cache-dir --quiet "$wheel"
          "$venv_python" scripts/ci/smoke_test_python_wheel.py \
            scripts/ci/fixtures/musl-python-smoke.pdf "XBERG MUSL SMOKE 490"
