name: CI Lint

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/**"
      - "e2e/**"
      - "tools/**"
      - "docs-site/**"
      - "scripts/**"
      - "*.toml"
      - "*.yaml"
      - "*.yml"
      - "*.md"
      # Root lockfiles. This job runs `uv sync --locked` and, through the poly hooks,
      # cargo-deny against Cargo.lock -- but neither file matched any pattern above, so the
      # one change that fixes a stale lock could not trigger the job that rejects it. A root
      # uv.lock pinning xberg at 1.1.6 survived two releases that way. ~keep
      - "uv.lock"
      - "Cargo.lock"
      - "package.json"
      - ".github/**"
      - ".task/**"
      - ".gitmodules"
      - "Taskfile.yml"
      - "alef.toml"
      - "pyproject.toml"
      - "plugin/**"
      - ".ai-rulez/**"
      - ".claude-plugin/**"
      - ".agents/plugins/**"
      - "test_documents"
  workflow_dispatch:

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-validation:
    name: AI governance validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Task
        uses: xberg-io/actions/install-task@54a96fe62890b0843bb33365f72926b6415c06f9
      - name: Validate AI governance inputs
        run: task governance:verify

  benchmark-scripts:
    if: github.event.pull_request.draft != true
    name: Benchmark script regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: xberg-io/actions/install-task@v1
      - name: Validate benchmark scripts
        run: task benchmark:validate:scripts
      - name: Validate Publish workflow contracts
        run: python3 scripts/ci/test_publish_workflow_contracts.py

  plugin-freshness:
    if: github.event.pull_request.draft != true
    name: Plugin bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      # The plugin version must track the core crate version (task version:sync keeps it
      # pinned via sync_integration_versions.py). Guards against a core bump landing
      # without the plugin version following — verify --plugin alone would not catch it. ~keep
      - name: Verify plugin version tracks core
        run: python3 scripts/sync_integration_versions.py --check
      # Byte-verify the ai-rulez-generated coding-agent plugin bundles under plugin/
      # match plugin/.ai-rulez (BLAKE3 provenance). Pinned to the ai-rulez version that
      # generates them; bump in lockstep with the generator. Regenerate with
      # `task plugin:generate`. ~keep
      - name: Check out the Pi-capable ai-rulez generator
        uses: actions/checkout@v7
        with:
          repository: Goldziher/ai-rulez
          ref: 8dfebd2b8b3700ff134f86886d5b44dca82abc18
          path: .tools/ai-rulez
      - name: Set up Go for ai-rulez
        uses: actions/setup-go@v7
        with:
          go-version-file: .tools/ai-rulez/go.mod
          cache-dependency-path: .tools/ai-rulez/go.sum
      - name: Build the pinned plugin generator
        working-directory: .tools/ai-rulez
        shell: bash
        env:
          GOWORK: "off"
        run: |
          eval "$(./scripts/setup-liter-llm.sh --mode static --format export)"
          mkdir -p "$RUNNER_TEMP/ai-rulez-bin"
          go build -o "$RUNNER_TEMP/ai-rulez-bin/ai-rulez" ./cmd/ai-rulez
          echo "$RUNNER_TEMP/ai-rulez-bin" >> "$GITHUB_PATH"
      - name: Verify generated plugin bundles are current
        run: ai-rulez verify --plugin
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify OpenCode tools and packed Pi resources
        run: |
          node --test scripts/tests/opencode-plugin.test.mjs
          python3 scripts/verify_pi_package.py

  submodule-gitlinks:
    if: github.event.pull_request.draft != true
    name: Submodule gitlinks reachable
    runs-on: ubuntu-latest
    steps:
      # submodules: false is deliberate -- we do NOT want git's own checkout-time
      # fetch of the submodule to run here. If a gitlink is unreachable, checkout
      # would die with a cryptic "not our ref" fatal; this job instead runs the
      # same check standalone so it can report the path, the SHA, and the fix. ~keep
      - uses: actions/checkout@v7
        with:
          submodules: false
      # CI has a reliable network, so unlike the local pre-push hook (which warns
      # on fetch failure to tolerate flaky connections), this job always fails hard
      # -- both on unreachable remotes and on a gitlink SHA that was never pushed.
      - name: Verify submodule gitlinks are reachable on their remotes
        run: scripts/ci/check-submodule-gitlinks.sh --on-fetch-failure=fail

  ruby-windows-features:
    if: github.event.pull_request.draft != true
    name: Ruby Windows feature agreement
    runs-on: ubuntu-latest
    steps:
      # submodules: false -- this job reads three manifests and a workflow file, no fixtures. ~keep
      - uses: actions/checkout@v7
        with:
          submodules: false
      # The Windows gem's binding features and the core features it compiles against are two
      # independent switches, and when they drift the generated conversions stop compiling on
      # that leg alone. It has broken the release twice and is invisible to every other job
      # here, because Linux and macOS never take the `--no-default-features` path. ~keep
      - name: Verify the Windows Ruby leg's features match the core bundle
        run: scripts/ci/check-ruby-windows-features.sh

  ffi-declaration-parity:
    if: github.event.pull_request.draft != true
    name: Hand-declared FFI surfaces match the emitted header
    runs-on: ubuntu-latest
    steps:
      # submodules: false -- reads the committed header, NativeMethods.cs, NativeLib.java
      # and the RID template; no fixtures. ~keep
      - uses: actions/checkout@v7
        with:
          submodules: false
      # C# DllImport and Java Panama FunctionDescriptor both restate every native signature
      # by hand, and neither restatement is checked at build time, so a wrong declaration
      # compiles clean and misbehaves only when the call runs. GH#1595 shipped that way in
      # BOTH: a six-parameter function declared with three, whose int32_t status was then
      # dereferenced as a pointer. Go is exempt -- cgo type-checks against the header. ~keep
      - name: Compare C# and Java declarations against xberg.h
        run: python3 scripts/ci/check-ffi-declaration-parity.py

  alef-readme-paths:
    if: github.event.pull_request.draft != true
    name: Alef readme/docs paths resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: xberg-io/actions/install-task@v1
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      # Static check: every readme/docs path alef.toml points at (templates,
      # snippets_dir + snippet_language overrides, CLI/MCP doc sources, skills
      # template_dir) must resolve on disk. Catches a class of bug that
      # previously needed a full ~10-minute `alef all` regen cycle per broken
      # path to discover -- this finds all of them in under a second. ~keep
      - name: Verify alef.toml readme/docs paths resolve
        run: task alef:verify:readme-paths
      # GH#1387: the FFI crate selects core features by hand (it cannot use `full`
      # -- cf7fa0533d dropped it to keep libheif/candle out of Swift's zigbuild
      # Linux targets), and that hand list silently lost eight formats. The fix was
      # applied to the GENERATED manifest, so the next regen reverted it invisibly:
      # `alef verify` compares an inputs hash, not content, and is green on a
      # manifest faithfully generated from a wrong source. This asserts alef.toml
      # AND the generated manifest both carry the formats. ~keep
      - name: Verify the native FFI build still selects every document format
        run: task alef:verify:ffi-formats
      - name: Verify published format counts match the MIME registry
        run: task supported-counts:verify
      # GH#1443: per-target feature aggregates in crates/xberg/Cargo.toml (windows-target,
      # formats-no-heic, full-no-heic, macos-intel-target, windows-gnu-target) are hand-maintained
      # supersets/subsets of `full` and silently drift when a feature is added to `full` without
      # updating them -- windows-target lost nine code-bearing features this way before
      # `45bbd99088` restored them by hand. Nothing else in CI compiles both sides to compare
      # them, so this only catches it statically, before the next silent regression ships. ~keep
      - name: Verify per-target feature aggregates match `full`
        run: task verify:feature-parity
      # Every image failed to build for weeks because `.dockerignore` excludes everything and
      # re-includes an allowlist: a new workspace member gained its Dockerfile `COPY` but no
      # allowlist entry, so buildx aborted with `not found` before compiling. The Docker workflow
      # triggers on paths that commit did not touch, so nothing caught it. This asserts the three
      # properties together -- every member is COPYd, every COPYd crates/ path is a real member,
      # and every COPYd path survives .dockerignore -- because coverage alone was green
      # throughout the outage. ~keep
      - name: Verify every workspace crate survives .dockerignore
        run: task verify:docker-crates
      # docs-site/src/content/docs/changelog.md is a hand-maintained copy of
      # CHANGELOG.md -- nothing generates it and nothing synced it, so it silently
      # fell a full release behind (repo at 1.1.0, published docs still at 1.0.14).
      # Asserts every release section is present AND byte-identical, so neither a
      # missed release nor a one-sided edit can drift again. ~keep
      - name: Verify the docs-site changelog is in sync
        run: task docs:verify:changelog

  alef-bindings-freshness:
    if: github.event.pull_request.draft != true
    name: Alef-generated bindings freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `alef verify` hashes the same alef.toml [[crates.source_crates]] entries
      # the e2e-freshness job below does, and those point at sibling polyrepo
      # checkouts. Without them it dies on `failed to compute sources hash:
      # failed to stat source ../html-to-markdown/...` before comparing anything,
      # so its red said nothing about whether the bindings are current. The refs
      # come from Cargo.lock for the same reason they do below: hashing newer
      # sources than the code compiled against would go red for a change nobody
      # made. ~keep
      - name: Resolve sibling crate versions from Cargo.lock
        id: siblings
        run: |
          set -euo pipefail
          crawlberg="$(awk '/^name = "crawlberg"$/{getline; gsub(/[^0-9.]/,""); print; exit}' Cargo.lock)"
          html_to_markdown="$(awk '/^name = "html-to-markdown-rs"$/{getline; gsub(/[^0-9.]/,""); print; exit}' Cargo.lock)"
          if [ -z "$crawlberg" ] || [ -z "$html_to_markdown" ]; then
            echo "::error::could not resolve sibling crate versions from Cargo.lock"
            exit 1
          fi
          echo "crawlberg=v$crawlberg" >>"$GITHUB_OUTPUT"
          echo "html_to_markdown=v$html_to_markdown" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: xberg-io/crawlberg
          ref: ${{ steps.siblings.outputs.crawlberg }}
          path: .polyrepo-siblings/crawlberg
      - uses: actions/checkout@v7
        with:
          repository: xberg-io/html-to-markdown
          ref: ${{ steps.siblings.outputs.html_to_markdown }}
          path: .polyrepo-siblings/html-to-markdown
      - name: Place sibling checkouts where alef.toml expects them
        run: |
          mv .polyrepo-siblings/crawlberg ../crawlberg
          mv .polyrepo-siblings/html-to-markdown ../html-to-markdown
          rmdir .polyrepo-siblings
      - name: Install Task
        uses: xberg-io/actions/install-task@v1
      - name: Verify Poly formatter scopes
        run: task poly:verify:tool-scopes
      # install-alef reads alef.toml's [workspace] alef_version and installs that
      # exact pinned build, so this job doesn't go red every time alef cuts a
      # release -- same hermeticity guarantee install-task gives the Task binary. ~keep
      - name: Install alef CLI
        uses: xberg-io/actions/install-alef@v1
        # alef is a third-party tool. The job-wide `-D warnings` turns its own
        # lint warnings into build errors, which has no bearing on this repo. ~keep
        env:
          RUSTFLAGS: ""
      # Generated Markdown and Rust bindings are committed after the same Poly formatting
      # pass used by `task alef:generate`. Alef verifies the formatted render when Poly is
      # available; without it this job compared raw backend output and reported false drift. ~keep
      # Poly's Java formatter runs on the configured JDK. Ubuntu's default JRE is 17, while
      # generated Java is formatted with the repository's Java 25 toolchain; keep verification
      # on that same toolchain so eight wrapped declarations do not oscillate in CI. ~keep
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"
      # Poly delegates Java formatting to the executables on PATH. Pin the same formatter chain
      # used for the committed Alef output; google-java-format alone is insufficient because Poly
      # 0.28.0 still applies the enabled clang-format catalog tool to Java despite its `files` glob.
      # LLVM 18 and 23 disagree on eight generated declarations. ~keep
      - name: Install Java formatter chain
        env:
          GOOGLE_JAVA_FORMAT_VERSION: "1.36.1"
          GOOGLE_JAVA_FORMAT_SHA256: "25b400f003089d23cc5320cdaf1a16cabee19b8aa3434d0ff021b3d9f42154b4"
          CLANG_FORMAT_VERSION: "23.1.1"
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/google-java-format"
          mkdir -p "$install_dir/bin"
          jar="$install_dir/google-java-format-${GOOGLE_JAVA_FORMAT_VERSION}-all-deps.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/google-java-format/releases/download/v${GOOGLE_JAVA_FORMAT_VERSION}/google-java-format-${GOOGLE_JAVA_FORMAT_VERSION}-all-deps.jar" \
            --output "$jar"
          echo "${GOOGLE_JAVA_FORMAT_SHA256}  ${jar}" | sha256sum --check --strict
          printf '#!/usr/bin/env bash\nexec java -jar %q "$@"\n' "$jar" >"$install_dir/bin/google-java-format"
          chmod +x "$install_dir/bin/google-java-format"
          echo "$install_dir/bin" >>"$GITHUB_PATH"
          "$install_dir/bin/google-java-format" --version
          clang_venv="$RUNNER_TEMP/clang-format"
          python3 -m venv "$clang_venv"
          "$clang_venv/bin/pip" install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            "clang-format==${CLANG_FORMAT_VERSION}"
          echo "$clang_venv/bin" >>"$GITHUB_PATH"
          "$clang_venv/bin/clang-format" --version
      - name: Install poly
        uses: Goldziher/poly@27da2cd18de12af901865b3096ad795302f60bc5
      # `alef verify` (aliased as `task alef:verify`) is a purpose-built freshness
      # check: it recomputes each generated file's expected hash from the current
      # Rust source, applies the configured formatter to the in-memory render, and
      # compares it to what's committed without writing files. Never run
      # `alef all --clean` here -- `alef generate --lang X`
      # deletes every other language's output, and even the safe `alef all` variant
      # means a full 15-language regen (minutes, not the sub-second cost of verify).
      # Blocking as of the b1c7c2a328 regen, which cleared the crates/xberg-node
      # drift this job was masked for (#323 -- `cargo check -p xberg-node
      # --all-targets` is clean on that tree). With the mask gone it correctly
      # goes red on a stale tree, which is the point. ~keep
      - name: Verify alef-generated bindings are current
        run: task alef:verify
      # `alef verify` above compares each generated file's hash to a hash of its own
      # generation inputs, so it is green whenever a regen would reproduce the tree --
      # including when a field was never wired into the generator's field list at all,
      # because then a regen changes nothing and no hash moves (GH#1745: a field added
      # to ExtractionConfig shipped absent from every binding while this job stayed
      # green throughout). This asserts the cheaper structural property instead: every
      # tracked config field's name appears somewhere in each language's own generated
      # surface. It does not require a full `alef all --clean` regen or the sibling
      # polyrepo checkouts above. ~keep
      - name: Verify tracked config fields reach every binding surface
        run: task alef:verify:fields
      # `alef verify` above already reports schema drift, but only as an informational
      # log line buried in its full-surface output -- it never fails, by upstream design:
      # a version-stamp-only difference still describes the same alef.toml config surface,
      # so editor validation stays correct either way (confirmed against alef 0.85.16's
      # `alef schema --help`). `alef schema --check` is the strict form and fails on that
      # same stamp-only drift, so it is deliberately NOT used to fail this job -- that would
      # force a schema-refresh commit on every alef version bump for a file nothing in this
      # repo consumes (no $schema reference, no editor config, no other CI job reads it).
      # Surface it as a workflow annotation instead, so it's visible in the PR checks UI
      # without adding a hard gate for a difference alef itself calls informational. ~keep
      - name: Check vendored alef schema freshness (informational)
        run: |
          if ! output=$(alef schema --check 2>&1); then
            echo "::warning::${output}"
          fi

  e2e-freshness:
    if: github.event.pull_request.draft != true
    name: Generated e2e suites freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # alef.toml's [[crates.source_crates]] entries hash Rust sources living in
      # sibling polyrepo checkouts (`../crawlberg`, `../html-to-markdown`), so
      # `alef e2e generate` cannot even compute its input hashes without them --
      # it died with `failed to stat source
      # ../crawlberg/crates/crawlberg/src/net/ssrf.rs`. actions/checkout refuses a
      # path outside $GITHUB_WORKSPACE, so they are cloned inside it and then moved
      # up next to the workspace, reproducing the polyrepo layout. xberg itself
      # stays at the workspace root because install-alef resolves the pinned
      # version by reading ./alef.toml. ~keep
      # Both siblings are ordinary crates.io dependencies, so their checkouts must
      # match the *resolved* versions rather than whatever their default branches
      # currently hold -- hashing newer sources than the code actually compiled
      # against would make this job red for a change nobody made. The refs are
      # derived from Cargo.lock so a dependency bump cannot silently desync them.
      - name: Resolve sibling crate versions from Cargo.lock
        id: siblings
        run: |
          set -euo pipefail
          crawlberg="$(awk '/^name = "crawlberg"$/{getline; gsub(/[^0-9.]/,""); print; exit}' Cargo.lock)"
          html_to_markdown="$(awk '/^name = "html-to-markdown-rs"$/{getline; gsub(/[^0-9.]/,""); print; exit}' Cargo.lock)"
          if [ -z "$crawlberg" ] || [ -z "$html_to_markdown" ]; then
            echo "::error::could not resolve sibling crate versions from Cargo.lock"
            exit 1
          fi
          echo "crawlberg=v$crawlberg" >>"$GITHUB_OUTPUT"
          echo "html_to_markdown=v$html_to_markdown" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: xberg-io/crawlberg
          ref: ${{ steps.siblings.outputs.crawlberg }}
          path: .polyrepo-siblings/crawlberg
      - uses: actions/checkout@v7
        with:
          repository: xberg-io/html-to-markdown
          ref: ${{ steps.siblings.outputs.html_to_markdown }}
          path: .polyrepo-siblings/html-to-markdown
      - name: Place sibling checkouts where alef.toml expects them
        run: |
          mv .polyrepo-siblings/crawlberg ../crawlberg
          mv .polyrepo-siblings/html-to-markdown ../html-to-markdown
          rmdir .polyrepo-siblings
      - name: Install Task
        uses: xberg-io/actions/install-task@v1
      - name: Install Elixir formatter
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - name: Install E2E formatter
        run: uv sync --locked --only-group dev --no-install-workspace
      # `[crates.e2e.format] dart` runs `dart format` on e2e/dart during `alef e2e generate`,
      # and alef 0.95.0 fails the run on a formatter exit code instead of deferring it, so
      # this job needs the same SDK the dart e2e leg and the snippet gate below use. ~keep
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13"
      - name: Install alef CLI
        uses: xberg-io/actions/install-alef@v1
        # alef is a third-party tool. The job-wide `-D warnings` turns its own
        # lint warnings into build errors, which has no bearing on this repo. ~keep
        env:
          RUSTFLAGS: ""
      # E2E hashes cover the formatted bytes. Keep Poly and every configured/default formatter
      # installed before strict generation so CI cannot compare raw Alef output with locally
      # formatted files. The bindings job deliberately omits them because `alef verify`
      # recomputes hashes without writing or formatting generated files. ~keep
      - name: Install poly
        uses: Goldziher/poly@v0
      # `task e2e:verify` (`alef e2e generate` then `git diff --exit-code e2e/`)
      # was previously invoked by nothing -- it was only named in a comment on
      # the alef-bindings-freshness job above as though it ran. Wiring it here
      # fails whenever a fixture changes without the generated e2e suites being
      # regenerated and committed alongside it. ~keep
      - name: Verify generated e2e suites are current
        run: task e2e:verify

  docs-snippets:
    if: github.event.pull_request.draft != true
    name: Docs snippets gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Task
        uses: xberg-io/actions/install-task@v1
      - name: Install alef CLI
        uses: xberg-io/actions/install-alef@v1
        # alef is a third-party tool. The job-wide `-D warnings` turns its own
        # lint warnings into build errors, which has no bearing on this repo. ~keep
        env:
          RUSTFLAGS: ""
      # Most per-language snippet validators (rust/python/typescript/go/ruby/php/
      # csharp/kotlin/c) are covered for free -- the ubuntu-latest runner image ships
      # those toolchains preinstalled, so `which tsc`/`which dotnet`/etc. already
      # succeed with no setup step here. SWIFT IS NOT among them, contrary to what this
      # comment claimed until 2026-08-27: `which swiftc` fails on that image, which is
      # why all 110 swift snippets report Unavailable. Adding a Swift toolchain would
      # not by itself help -- swift snippets link the FFI artifact this job never
      # builds, so they would trade Unavailable for a link failure, which is why swift
      # is excluded below rather than installed. Dart and Elixir are not on that
      # image, so their validators (which::which("dart"/"mix")) always reported
      # Unavailable and those snippets were never actually checked -- confirmed via
      # `gh run view --job=94784579741 --log`, which shows `... dart N/A ...`,
      # `... elixir N/A ...` in the summary while every other language shows a real
      # PASS/FAIL. Versions match the e2e matrix (ci-e2e.yaml) so this job validates
      # snippets against the same toolchains the generated e2e suites run against.
      # Zig was briefly added here too (a `Setup Zig` step), on the same premise --
      # but zig's 110 snippets link `../../target/release/libxberg_ffi.so`, which this
      # job never builds, so they report Unavailable regardless of toolchain presence.
      # The step was removed; zig is excluded below alongside go/typescript/kotlin/
      # swift instead -- see the `~keep` comment on `snippets:all` in
      # `.task/tools/docs.yml` for the full accounting. ~keep
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          # packages/dart's freezed ^4.0.1 resolves to freezed >=4.0.0, which needs
          # SDK >=3.13.0; every dart snippet fails pub version-solving before it
          # compiles otherwise (110 of the gate's 111 failures). The required floor
          # moves with whichever freezed pub picks, so read the error's own
          # "requires SDK version" rather than assuming the previous floor. ~keep
          sdk: "3.13"
      - name: Setup Elixir
        uses: xberg-io/actions/setup-elixir@v1
        with:
          elixir-version: "1.19"
          otp-version: "28"
      # Java is the one preinstalled toolchain that is not usable as shipped: the
      # ubuntu-latest image's default JRE is 17 (`class file versions up to 61.0`), and
      # the java validator runs maven against packages/java, whose checkstyle plugin
      # carries class file version 65.0. Without this the job died on
      # `UnsupportedClassVersionError` for every one of the 139 java snippets. 25 matches
      # packages/java/pom.xml `<maven.compiler.release>` and the `validate` job below,
      # which already sets the same version for the same reason. ~keep
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # The rust validator compiles its snippets against xberg, which reaches
      # heic -> xberg-libheif -> libheif-sys. That build script shells out to
      # `pkg-config libheif >= 1.21` and Ubuntu Noble ships only 1.17.6, so every
      # one of the 91 rust snippets failed with `The system library libheif
      # required by crate libheif-sys was not found` -- one build-script failure
      # attributed to all 91. This action builds and caches libheif 1.23.0 into
      # /usr/local with its .pc file, and is the same remedy the `validate` job
      # below applies via the reusable workflow's `install-system-deps`. ~keep
      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
      # `task docs:snippets:all` (audit + gaps + validate) is described as the
      # "canonical docs:snippets gate" in .task/tools/docs.yml, but nothing
      # invoked it -- a broken or orphaned snippet could land undetected. ~keep
      # This job never runs `alef build`/`task build`, so `validation_level =
      # "compile"` (alef.toml) can only succeed for languages that need no
      # built xberg artifact: c, csharp, dart, elixir, java, php, python,
      # ruby, rust. `task docs:snippets:all` restricts the compile check
      # to exactly that set via `--lang` -- see the `~keep` comment on
      # `snippets:all` in .task/tools/docs.yml for the measured per-language
      # breakdown and why `--lang`'s fence-tag granularity forces dropping
      # typescript (node+wasm) and kotlin (JVM+android) as whole groups rather
      # than just their broken wasm/android halves.
      #
      # NOT compile-verified in this job: go (141 snippets -- needs
      # `libxberg_ffi.so`), typescript (124 snippets across node+wasm -- wasm
      # needs the built `@xberg-io/xberg-wasm` package), kotlin (104 snippets
      # across kotlin+kotlin_android -- android needs an Android/Gradle
      # build), swift (110 snippets -- no Swift toolchain installed here at
      # all), zig (110 snippets -- needs `target/release/libxberg_ffi.so`,
      # same as go; a `Setup Zig` step was tried here first but the missing
      # artifact is the real blocker, not the toolchain, so it was removed and
      # zig joined this list instead). That is ~589 of 1985 snippets (~30%)
      # with no compile-level gate anywhere today; audit/gaps above still
      # cover their structure and cross-language parity. Closing this belongs
      # in ci-e2e.yaml's per-language matrix legs, which already build each
      # language's native artifact -- not here, where the only fix would be a
      # second, ~1-hour, redundant FFI build per run. ~keep
      - name: Run docs snippets gate
        run: task docs:snippets:all
      - name: Report snippet languages not compile-verified in this job
        if: always()
        run: |
          echo "::notice::docs-snippets gate does not compile-verify: go (141 snippets), \
          typescript/node+wasm (124 snippets), kotlin/kotlin_android (104 snippets), \
          swift (110 snippets), zig (110 snippets) -- see the ~keep comment above this step \
          and in .task/tools/docs.yml:snippets:all for why and where that coverage belongs."

  validate:
    if: github.event.pull_request.draft != true
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      # poly-version is deliberately unset so the reusable workflow resolves the
      # newest release. A pin goes stale against the tree: an alef regen reformats
      # with the poly bundled in the alef toolchain, so `poly fmt --check` then fails
      # on files the regen itself just rewrote -- `c0aa8575e2` re-indented
      # docs-site/src/components/ApiSnippetGroup.astro under a newer poly while the
      # pin still enforced v0.21.0's rules. Reverting the file is not the fix; the
      # next regen undoes it. ~keep
      # Deliberately false. This input once had to be true because poly.toml defined an
      # `alef-snippets` hook and only this input installed the alef CLI poly needed
      # (`× alef-snippets / poly-hook: 1: alef: not found`, jobs 93568055890/93702252442).
      # That hook no longer exists -- `1449ebdf83` dropped it and alef.toml no longer
      # declares it -- so `poly lint .` needs no alef binary and this job needs no alef.
      # Leaving it true is now actively harmful: it also runs the reusable workflow's own
      # `alef snippets check --strict --cache off`, which takes NO `--lang` filter, in a
      # job that builds no native artifacts. 469 snippets (go, typescript/wasm,
      # kotlin_android, zig, swift) report Unavailable, and --strict fails on Unavailable,
      # so the step can never pass here regardless of snippet quality. Both halves of it
      # are already covered by dedicated jobs above: `Generated e2e suites freshness`
      # runs `alef e2e generate` + `git diff --exit-code e2e/`, and `Docs snippets gate`
      # runs the strict check scoped by `--lang` to the languages this runner can satisfy.
      # This job's own purpose is `poly fmt --check` and `poly lint .`, which the failing
      # step masked. ~keep
      check-fixture-snippets: false
      setup-rust: true
      # poly's cargo-clippy hook builds the whole workspace, and
      # tools/benchmark-harness depends on xberg with `full`, which pulls
      # heic -> xberg-libheif -> libheif-sys. Its build script shells out to
      # `pkg-config libheif >= 1.21` and Ubuntu Noble only ships 1.17.6, so
      # without this the Lint step dies before linting anything. ~keep
      install-system-deps: true
      setup-python: true
      # poly delegates Elixir formatting to `mix format` when mix is on PATH, and falls
      # back to its own built-in Elixir formatter when it is not. The two disagree, so
      # without a toolchain the `Format check` step flagged all 240 committed .ex files
      # -- which are correctly mix-formatted (they honour packages/elixir/.formatter.exs:
      # import_deps: [:rustler], line_length: 140). Reproduced exactly: with mix on PATH
      # `poly fmt --check packages/elixir` reports "All formatted"; with PATH=/usr/bin:/bin
      # it reports the same 240 files CI did. ~keep
      setup-elixir: true
      # poly's rubocop and steep hooks both run `bundle exec` with root =
      # packages/ruby (poly.toml:644,650). Without a Ruby toolchain the Lint step
      # dies with `poly-hook: 1: bundle: not found` -- which is what it started
      # doing once install-system-deps got it past the libheif failure above.
      # The reusable workflow's ruby-working-directory already defaults to
      # packages/ruby, so it needs no override. ~keep
      setup-ruby: true
      # The three hooks below were the remaining `×` in the Lint step once setup-ruby got
      # rubocop and steep to `✓`. None of them was a code-quality failure -- each was a
      # missing or mismatched toolchain, so the hook could never report anything useful.
      #
      # checkstyle died with `UnsupportedClassVersionError:
      # com/puppycrawl/tools/checkstyle/api/CheckstyleException has been compiled by a more
      # recent version of Java`. java-version is 25, not the workflow's 21 default, to match
      # packages/java/pom.xml:40 `<maven.compiler.release>25</maven.compiler.release>`; 21
      # clears checkstyle 13.9.0's own floor but not the bindings' target bytecode. ~keep
      setup-java: true
      java-version: "25"
      # golangci-lint failed with `poly-hook: 1: golangci-lint: not found`. ~keep
      setup-go: true
      # dart-analyze failed with no Dart SDK present. ~keep
      setup-dart: true
