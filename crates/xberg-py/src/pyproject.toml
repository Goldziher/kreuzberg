[build-system]
build-backend = "maturin"
requires = ["maturin>=1,<2"]

[project]
name = "xberg"
version = "1.4.0"
description = "High-performance document intelligence library"
keywords = ["document", "extraction", "ocr", "pdf", "text"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
maintainers = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
urls.repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"

[dependency-groups]
dev = ["pyrefly>=1.4"]

[tool.maturin]
module-name = "xberg._xberg"
manifest-path = "../../crates/xberg-py/Cargo.toml"
# abi3-py310 produces a single wheel per platform that loads on Python 3.10+,
# avoiding a per-Python-version build matrix. ~keep
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-packages = ["xberg"]
# Bundle the core Rust crate so `pip install` can build from sdist on
# platforms without a precompiled wheel (e.g. Alpine/musl). Without this
# the workspace [patch.crates-io] (when present) points at a path that is
# missing from the tarball and the source build fails. ~keep
include = [{ path = "../../crates/xberg/**/*", format = "sdist" }]

[tool.pyrefly]
python-version = "3.10"
preset = "strict"
