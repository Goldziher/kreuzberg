[package]
name = "xberg-libheif"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
description = "Safe libheif bindings for Xberg — HEIF/HEIC/AVIF decoding (vendored from Cykooz/libheif-rs)"
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
documentation = "https://docs.rs/xberg-libheif"
readme = "README.md"
keywords = ["heic", "heif", "avif", "libheif", "xberg"]
categories = ["multimedia::images", "api-bindings"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE*", "/README*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "xberg_libheif"
crate-type = ["lib"]

[features]
# `v1_19`, NOT `latest`: the highest enabled `v1_*` feature is what `libheif-sys`'s build
# script turns into a `pkg-config --atleast-version` floor, so this default decides the oldest
# libheif the whole workspace can build against. It must match `LIBHEIF_VERSION` in
# scripts/ci/install-system-deps/install-linux.sh and the pin on `xberg-libheif` in
# crates/xberg/Cargo.toml -- both sit at 1.19 so the dynamically linked artifacts stay loadable
# on Debian 13 (xberg-io/xberg#1541). `default = ["latest"]` broke that: `cargo clippy
# --workspace` builds this crate as its own root with default features on, and feature
# unification then raised the floor for every other member to `libheif >= 1.21`, above the
# 1.19.8 CI installs. Opt into `latest` explicitly when a newer libheif is guaranteed. ~keep
default = ["v1_19"]
v1_17 = ["libheif-sys/v1_17"]
v1_18 = ["v1_17", "libheif-sys/v1_18"]
v1_19 = ["v1_18", "libheif-sys/v1_19"]
v1_20 = ["v1_19", "libheif-sys/v1_20"]
v1_21 = ["v1_20", "libheif-sys/v1_21"]
latest = ["v1_21"]
# Register libheif as a decoder for the `image` crate.
image = ["dep:image"]

[dependencies]
cfg-if = "1.0"
enumn = "0.1.14"
four-cc = "0.4"
image = { workspace = true, optional = true }
libc = { workspace = true }
libheif-sys = "5.3"

[lints]
workspace = true
