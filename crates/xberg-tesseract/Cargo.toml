[package]
name = "xberg-tesseract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Rust bindings for Tesseract OCR with cross-compilation, C++17, and caching improvements"
license = "MIT"
repository.workspace = true
homepage = "https://xberg.io"
documentation = "https://docs.xberg.io"
readme = "README.md"
keywords = ["tesseract", "ocr", "bindings", "vision", "recognition"]
categories = ["external-ffi-bindings", "computer-vision", "text-processing"]
build = "build.rs"
links = "xberg_tesseract"
include = [
  "/src/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README*",
  "/build.rs",
  "/build_support/**",
  "/licenses/**",
  "/patches/tesseract.diff",
  "!/src/leptonica/tests.rs",
]

[target.'cfg(target_os = "windows")'.dev-dependencies]
same-file.workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "xberg_tesseract"
crate-type = ["lib"]

[features]
default = ["static-linking"]
build-tesseract = ["cc", "cmake", "reqwest", "zip"]
build-tesseract-wasm = ["cmake", "reqwest", "zip"]
# Bundle eng.traineddata into the compiled crate so WASM builds can run OCR
# without runtime tessdata loading. Uses ~4 MB of binary size (tessdata_fast).
bundle-tessdata-eng = []
static-linking = ["build-tesseract"]
dynamic-linking = ["build-tesseract", "dep:pkg-config", "dep:vcpkg"]
# Discover and link the host's Tesseract and Leptonica instead of downloading and building
# vendored copies. The system headers also compile the internal C++ exception shim.
#
# `build-tesseract` enables the native API surface and C++ compiler dependency. `main` in build.rs
# gives `dynamic-linking` precedence, so the vendored source build remains disabled. ~keep
system-linking = ["dynamic-linking"]

[dependencies]
thiserror = { workspace = true }

[build-dependencies]
cc = { version = "^1.7.0", optional = true }
cmake = { version = "0.1.58", optional = true }
libc = { workspace = true }
pkg-config = { version = "0.3.34", optional = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
vcpkg = { version = "0.2.15", optional = true }
zip = { version = "9.0.1", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(target_os = "windows"))'.build-dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls"], optional = true }

# Use native-tls on Windows to avoid aws-lc-sys CMake build issues with MinGW
[target.'cfg(target_os = "windows")'.build-dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "native-tls"], optional = true }
same-file.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
libc = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
zip = { version = "9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
