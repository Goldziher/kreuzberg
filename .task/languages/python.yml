version: "3"
internal: true

vars:
  PYTHON_PKG: "packages/python"

tasks:
  update:
    desc: "Update Python dependencies within major versions (uv sync --upgrade-package)"
    silent: false
    cmds:
      - cmd: |
          cd {{.PYTHON_PKG}} && uv sync --no-install-project --no-install-workspace --all-extras --upgrade-package "*"
        ignore_error: false

  upgrade:
    desc: "Upgrade Python dependencies to latest including breaking changes (uv sync --upgrade)"
    silent: false
    cmds:
      - cmd: |
          cd {{.PYTHON_PKG}} && uv sync --no-install-project --no-install-workspace --all-extras --upgrade
        ignore_error: false
      # Generated e2e harness keeps its own uv.lock; refresh it so `task upgrade` covers e2e
      # and its lock does not drift behind the workspace. ~keep
      - cmd: |
          cd e2e/python && uv lock --upgrade
        ignore_error: true

  publish:archive:prepare:
    desc: Validate combined Python artifacts and prepare their public archive release
    cmds:
      - python3 scripts/ci/python_archive_publication.py prepare

  publish:archive:wait:
    desc: Refresh the central Python index and wait for verified public artifacts
    cmds:
      - python3 scripts/ci/python_archive_publication.py wait

  publish:archive:test:
    desc: Test Python archive publication and its bounded readiness gate
    cmds:
      - uv run --no-sync python -m pytest scripts/ci/test_python_archive_publication.py -v
