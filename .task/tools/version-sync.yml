version: "3"
internal: true

includes:
  platforms: ../config/platforms.yml

vars:
  ALEF: "alef"

tasks:
  sync:
    desc: "Synchronize version across all package manifests (no regeneration)"
    cmds:
      - "{{.ALEF}} sync-versions"
      # Integrations are versioned + published in lockstep with core (including rc);
      # alef only syncs the alef-managed binding manifests, so sync integrations too.
      # This also writes plugin/.ai-rulez/config.toml [plugin].version. ~keep
      - "python3 scripts/sync_integration_versions.py"
      # Regenerate the coding-agent plugin bundles from the just-synced config so the
      # per-runtime manifests under plugin/ carry the new version. ~keep
      - "ai-rulez generate --plugin"

  check:
    desc: "Check if versions are synchronized (dry-run)"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
      - "python3 scripts/sync_integration_versions.py --check"

  bump:major:
    desc: "Bump major version (X.0.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump major"
      - task: sync

  bump:minor:
    desc: "Bump minor version (0.X.0) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump minor"
      - task: sync

  bump:patch:
    desc: "Bump patch version (0.0.X) and sync"
    cmds:
      - "{{.ALEF}} sync-versions --bump patch"
      - task: sync

  set:
    desc: "Set explicit version and sync (usage: task version:set -- 4.10.0-rc.1)"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - "{{.ALEF}} sync-versions --set {{.CLI_ARGS}}"
      - task: sync

  show:
    desc: "Show current version from Cargo.toml"
    cmds:
      - cmd: grep -m 1 'version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/'
        silent: false
