
version = "5.0"
name = 'Xberg'
description = 'Rust document intelligence library with active Python, TypeScript/Node, Ruby, PHP, Go, Java, C#, Elixir, WebAssembly, Dart, Kotlin Android, Swift, Zig, and C FFI bindings'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = [
  '!git-workflow',
  'rust',
  'python',
  'go',
  'java',
  'ruby',
  'php',
  'csharp',
  'elixir',
  'typescript',
  'wasm',
  'pyo3',
  'napi-rs',
  'magnus',
  'ext-php-rs',
  'rustler',
  'cgo',
  'jni-rs',
  'default-commands',
]

# No builtin exists for Dart, Swift, Zig, Kotlin Android or the raw C ABI. Those five are
# governed only by their specialist agents in agent-conventions/modules/languages/agents/
# plus the shared binding-architecture skill. Do not enable 'polyglot-bindings' to paper over
# it: it ships ffi-engineer + polyglot-architect agents that collide with the tuned copies in
# agent-conventions/modules/core/agents/. ~keep

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/cicd'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-infrastructure'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/infrastructure'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-e2e-generator'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/e2e-generator'
merge_strategy = 'local-override'

[[installed_skills]]
name = 'alef'
source = 'https://github.com/xberg-io/alef.git'

[[mcp_servers]]
name = 'playwright'
description = 'Playwright browser automation for E2E testing and docs verification'
command = 'npx'
args = ['-y', '@playwright/mcp@latest']

[defaults]
effort = 'medium'

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Plugin authoring: `ai-rulez generate --plugin` fans plugin/.ai-rulez/config.toml
# ([plugin] block) out to per-runtime bundles under plugin/ and emits the repo-root
# marketplace index. Only read by `generate --plugin`; normal governance generation ignores it.
[marketplace]
name = "xberg"
description = "Document intelligence for coding agents, by Kreuzberg, Inc."
members = ["plugin"]

[marketplace.owner]
name = "Kreuzberg, Inc."
email = "contact@xberg.io"

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
hashes = "full"
