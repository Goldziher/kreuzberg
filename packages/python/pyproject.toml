[build-system]
build-backend = "maturin"
requires = ["maturin>=1,<2"]

[project]
name = "xberg"
version = "1.3.8"
description = "High-performance document intelligence library"
keywords = ["document", "extraction", "ocr", "pdf", "text"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
maintainers = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
urls.repository = "https://github.com/xberg-io/xberg"
homepage = "https://xberg.io"

[dependency-groups]
dev = ["pyrefly>=1.3"]

[tool.maturin]
profile = "release"
module-name = "xberg._xberg"
manifest-path = "../../crates/xberg-py/Cargo.toml"
# abi3-py310 produces a single wheel per platform that loads on Python 3.10+,
# avoiding a per-Python-version build matrix.
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-packages = ["xberg"]

[tool.pyrefly]
python-version = "3.10"
preset = "strict"
# `bad-return` and `bad-argument-type` used to be suppressed here for every generated
# `api.py`: the wrapper's declared type (an `options.*` dataclass) and the value pyo3
# actually returned/accepted (the native `_internal_bindings.*` pyclass) disagreed on
# every boundary crossing, and pyrefly correctly rejected all of them. The codegen now
# emits the `_to_rust_*` / `_from_native_*` conversions those boundaries need (alef-310),
# so both codes are gone from this list.
#
# The three below were re-audited (alef-334) against
# `bin_cli::all_commands::pyrefly_generated_package_tests`'s fixture, extended to cover
# each code's most plausible generated shape: a multi-parameter native-constructor call in
# `_to_rust_filter` (bad-argument-count), a `Vec<enum>` field routed through the
# `[_coerce_enum(_rust.X, v) for v in value.field]` comprehension (not-iterable), and a
# nested options-dataclass chain in `_to_rust_person` (missing-attribute). With this
# suppression lifted, that fixture's real generated `api.py` type-checks clean under real
# pyrefly 1.2.0. Hand-corrupting those exact call sites (an extra positional arg; an
# iteration over a non-iterable; a typoed attribute) reliably reproduces, respectively:
#   `Expected 3 positional arguments, got 4 in function `test_lib.test_lib.Filter.__init__`
#   [bad-argument-count]`
#   `Type `Literal[5]` is not iterable [not-iterable]`
#   `Object of class `Person` has no attribute `addresss` [missing-attribute]`
# proving the gate can and does catch each code -- a clean run is not vacuous. No defect
# was found under the shapes that fixture covers, but the pyo3 backend's less-common
# surfaces (service_api decorators, trait_bridge visitors, streaming adapters, capsule
# types) were not exercised by this audit; do not fold these back in without extending
# that fixture to cover whichever surface prompted the re-audit.
#
# `open-unpacking` is suppressed for a different reason: it is not a latent-defect code but a
# structural one, and it fires on correct generated code. A converter omits a keyword whose
# value may be absent by unpacking a one-key `TypedDict` helper
# (`_optional_<type>_<field>`), and pyrefly's `strict` preset rejects unpacking any
# non-PEP-728-`closed` `TypedDict` into a callable that has no `**kwargs`:
#   `_XKwargs` is an open TypedDict with unknown extra items, which cannot be unpacked into a
#   callable without `**kwargs` [open-unpacking]
# The two alternatives were both measured and both rejected. Marking the helper
# `closed=True` silences it, but `closed` is a `TypeError` on `typing.TypedDict` through
# Python 3.14 (PEP 728 lands in the 3.15 stdlib), so it forces a `typing-extensions` RUNTIME
# dependency into every published wheel at `requires-python = ">=3.10"`. Returning a plain
# `dict[str, V]` instead needs no dependency and is clean when every unpacked value in one
# constructor call has the SAME type -- but pyrefly resolves an unpacked `dict[str, V]`
# against every remaining parameter, so a call with heterogeneous value types (the shape
# `backends::pyo3::kwarg_unpack_tests`'s
# `mixed_optional_primitive_defaults_use_heterogeneous_kwarg_helper` is named for: `float`,
# `int` and `bool` helpers on one constructor) yields one `[bad-argument-type]` per
# incompatible pair -- 3 errors for 3 fields, and under the `default` preset too, i.e. worse
# than what is suppressed here. The `TypedDict` is what keeps BOTH the value type and the key
# name checked: a wrong value type is `[bad-argument-type]` and a typoed key is
# `[unexpected-keyword]`, both verified against real emitted output under this very config by
# the negative controls in `generated_mixed_optional_kwargs_pass_pyrefly_and_typed_sabotage_fails`,
# which also asserts that removing THIS line brings `[open-unpacking]` straight back. ~keep
[[tool.pyrefly.sub-config]]
matches = "**/api.py"
[tool.pyrefly.sub-config.errors]
bad-argument-count = false
not-iterable = false
missing-attribute = false
open-unpacking = false
