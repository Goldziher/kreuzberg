[project]
name = "llama-index-xberg"
version = "0.0.0"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "xberg>=1.4.0,<2",
  "llama-index-core>=0.14.25,<0.15",
  "pyrefly>=1.4",
  "pre-commit>=4.6",
  "pydantic>=2.14.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
]

[tool.pyrefly]
python-version = "3.10"
preset = "strict"
search-path = ["readers/llama-index-readers-xberg", "node_parsers/llama-index-node-parser-xberg"]
