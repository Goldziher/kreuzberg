[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "crewai-xberg"
version = "1.3.8"
description = "Xberg document extraction tools for CrewAI agents — text, metadata, and batch extraction across 107 file formats"
readme = "README.md"
keywords = ["agents", "ai", "crewai", "document-extraction", "llm", "ocr", "pdf", "rag", "text-extraction", "xberg"]
license = "MIT"
maintainers = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
authors = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: General",
  "Typing :: Typed",
]
dependencies = ["crewai>=1.15,<2", "xberg>=1.3.8,<2"]
urls.Changelog = "https://github.com/xberg-io/xberg/blob/main/integrations/python/crewai/CHANGELOG.md"
urls.Homepage = "https://github.com/xberg-io/xberg/tree/main/integrations/python/crewai"
urls.Repository = "https://github.com/xberg-io/xberg/tree/main/integrations/python/crewai"

[dependency-groups]
dev = ["mypy>=1.19", "pre-commit>=4", "pytest>=9", "pytest-asyncio>=1", "pytest-cov>=6"]

[tool.hatch]
build.targets.sdist.include = ["src/crewai_xberg", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]
build.targets.wheel.packages = ["src/crewai_xberg"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = ["crewai_xberg"]
report.fail_under = 80

[tool.uv]
# xberg ships as a pre-release (1.0.0rcN) until the 1.0.0 GA; persist prerelease
# resolution so the lockfile is authoritative and `uv run` does not re-resolve. ~keep
prerelease = "allow"

# onnxruntime stopped shipping cp310 wheels at 1.24.0 -- 1.23.2 is the last release with one --
# but its metadata still advertises requires-python >=3.10. uv therefore resolves 1.24.x for the
# sub-3.11 fork and the install fails with "doesn't have a source distribution or wheel for the
# current platform". The CI matrix for this package tests 3.10 and nothing else, so that job
# failed on every run. Hold the 3.10 fork at the last version that actually has a wheel. ~keep
constraint-dependencies = ["onnxruntime<1.24; python_full_version < '3.11'"]
